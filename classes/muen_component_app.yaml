inherit: [muen_component, muen_component_cspecs, install]

depends:
  - muen::component-libmubase-ld

buildVars: [ARCH]
buildTools: [mucheckstack, mucbinsplit]
buildSetup: |
  __SRC=$1

  # -s <spec>
  # -n <binary name>
  # $1 - SRC relative component directory
  muenBuildApp() {
    local SPEC
    local BIN_NAME
    local STACK_SIZE=8192
    # parse args
    OPTIND=1
    local opt
    while getopts "n:s:S:" opt ; do
        case "$opt" in
            n)
                BIN_NAME="$OPTARG"
                ;;
            s)
                SPEC="$OPTARG"
                ;;
            S)
                STACK_SIZE=$OPTARG
                ;;
            \?)
              echo "Invalid option: -$OPTARG" >&2
              exit 1
              ;;
        esac
    done
    shift $(( OPTIND -1 ))

    if [ $# -ne 1 ]; then
      echo "Invalid number of arguments: $# : ${@}" >&2
      exit 1
    fi

    muenCspecs $1 ${SPEC:-}

    # check for arch-specific project file
    PRJ="${1##*/}"
    if [ -f "${__SRC}/${1}/${PRJ}_${ARCH}.gpr" ]; then
      PRJ=${PRJ}_${ARCH}
    fi
    muenBuild ${__SRC}/${1}/${PRJ} \
      -Xlinker_script=${BOB_DEP_PATHS[muen::component-libmubase-ld]}/component.ld \
      -Xstacksize=${STACK_SIZE}

    # stackcheck
    export OBJ_DIR=$(pwd)/build/obj/
    mucheckstack -P${__SRC}/${1}/${PRJ} -l${STACK_SIZE}

    # binsplit
    if [[ -e generated/${1##*/}.xml ]]; then
      mkdir -p install/.bob/cspecs/
      mucbinsplit -i generated/${1##*/}.xml \
                  -b install/usr/bin/${BIN_NAME:-${1##*/}} \
                  -o install/.bob/cspecs/${1##*/}.xml install/
    fi
  }

packageSetup: |
  __SRC=$1
  muenInstallApp() {
    installPackageBin $__SRC/install/ ".bob" ".bob/***"
  }
