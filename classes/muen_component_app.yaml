inherit: [muen_component, muen_component_cspecs, install]

depends:
  - muen::component-libmubase-ld

buildVars: [ARCH]
buildTools: [mucheckstack, mucbinsplit]
buildSetup: |
  __SRC=$1

  # $1 - SRC relative component directory
  # $2 - Component spec XML to use (optional)
  muenBuildApp() {
    muenCspecs $1 ${2:-}
    GPRBUILD_EXTRA_ARGS="
      -Xlinker_script=${BOB_DEP_PATHS[muen::component-libmubase-ld]}/component.ld \
      -Xstacksize=8192" \

    # check for arch-specific project file
    PRJ="${1##*/}"
    if [ -f "${__SRC}/${1}/${PRJ}_${ARCH}.gpr" ]; then
      PRJ=${PRJ}_${ARCH}
    fi
    muenBuild -n ${__SRC}/${1}/${PRJ}

    # stackcheck
    export OBJ_DIR=$(pwd)/build/obj/
    mucheckstack -P${__SRC}/${1}/${PRJ} -l8192

    # binsplit
    if [[ -e generated/$1.xml ]]; then
      mucbinsplit -i generated/$1.xml \
                  -b install/usr/bin/$1 \
                  -o install/$1.xml install/
    fi
  }

packageSetup: |
  __SRC=$1
  muenInstallApp() {
    installPackageBin $__SRC/install/
    mkdir -p .bob
    echo "$1.xml" > .bob/cspecs
  }
