inherit: [muen_component]

metaEnvironment:
  PKG_LICENSE: "GPL-2.0-or-later"

checkoutSCM:
  scm: git
  url: https://git.codelabs.ch/libxhcidbg.git
  branch: muen
  commit: 9e6b1a199372845d7aac5f6adb6b262f9cb66b1c

depends:
  - libs::libhwbase-dev

buildTools: [mucgenspec]
buildSetup: |
  export LIBXHCI_GENERATED=$(pwd)/generated
  mucgenspec -i $1/spec/libxhcidbg.xml generated

buildScript: |
  ln -snf $1/spec/libxhcidbg.xml .
  muenBuild $1/libxhcidbg

multiPackage:
  dev:
    provideDeps: ['*-dev']
    packageScript: |
      muenInstallPackageDev
  tgt:
    packageScript: |
      muenInstallPackageTgt
      mkdir -p .bob/cspecs/
      cp -L $1/libxhcidbg.xml .bob/cspecs
