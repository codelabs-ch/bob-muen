
checkoutSCM:
  scm: git
  url: https://git.codelabs.ch/muen/build-cfg.git
  branch: main
  commit: af7f4da48c54532d14daab1cbb6134c946aa740a

buildScript: |
  rsync -a --delete $1/ .

multiPackage:
  gpr:
    packageScript: |
      rm -rf .gpr_project
      GPR_PROJECT_PATH=""
      rsync -a --delete $1/gpr/ .
      for GPR in $(find . -name "*.gpr" -printf '%h\n' | uniq | sort); do
        [ ! -z ${GPR_PROJECT_PATH} ] && GPR_PROJECT_PATH+=":"
        GPR_PROJECT_PATH+="${GPR}"
      done
      echo "GPR_PROJECT_PATH=${GPR_PROJECT_PATH}" >> .gpr_project

  scripts:
    packageScript: |
      rsync -a --delete $1/scripts/ .
