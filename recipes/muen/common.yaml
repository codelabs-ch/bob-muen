metaEnvironment:
  PKG_LICENSE: "GPL-3.0-or-later"

checkoutSCM:
  scm: git
  url: https://git.codelabs.ch/muen/common.git
  branch: misc-minor
  commit: 605acfb9054b4a9722f57f8c1770224b400cc58c

multiPackage:
  gpr:
    buildScript: |
      rsync -a --delete $1/gpr .
    packageScript: |
      cp $1/gpr/* .
      echo "GPR_PROJECT_PATH=." >> .gpr_project

  "":
    inherit: [muen_component]
    buildVars: [ARCH, MUEN_BUILD_MODE]
    multiPackage:
      debug:
        depends:
          - muen::common-common-dev
          - muen::common-strings-dev
          - muen::common-crash_audit-dev
        privateEnvironment:
          GPR_PATH: "debug/common_debug"
        buildVars: [MUEN_COMMON_VARIANT, GPR_PATH]
        multiPackage: &common_provides_lib
          "":
            buildScript: |
              muenBuild $1/${GPR_PATH}
            multiPackage:
              dev:
                provideDeps: ['*-dev']
                packageScript: muenInstallPackageDev
              tgt:
                provideDeps: ['*-tgt']
                packageScript: muenInstallPackageTgt
          proof: &common_proof
            inherit: [muen_proof]
            buildSetup: |
              export GPR_FILE=$1/${GPR_PATH}
              export MUEN_BUILD_MODE=prove
              export OBJ_DIR=$(pwd)/obj/
              export LIB_DIR=$(pwd)/lib/
            buildScript: |
              muenProof
      crash_audit:
        depends:
          - muen::common-common-dev
        privateEnvironment:
          GPR_PATH: "crash_audit/crash_audit"
        buildVars: [MUEN_COMMON_VARIANT, GPR_PATH]
        multiPackage: *common_provides_lib
      common:
        privateEnvironment:
          GPR_PATH: "src/muen_common"
        buildVars: [ARCH, GPR_PATH, MUEN_COMMON_VARIANT]
        multiPackage:
          "":
            buildScript: |
              muenBuild $1/${GPR_PATH}
            multiPackage:
              dev:
                packageScript: |
                  muenInstallPackageDev
                  GPR=usr/share/gpr/muen_common.gpr
                  sed -i -E '/for Languages use/ { s/, *"Asm"//; s/"Asm", *// }' $GPR
                  if grep -q '"Asm"' $GPR; then
                    echo "Failed to drop Asm language from $GPR" >&2
                    exit 1
                  fi
              tgt:
                packageScript: muenInstallPackageTgt
          proof: *common_proof
      strings:
        depends:
          - muen::common-common-dev
        privateEnvironment:
          GPR_PATH: "strings/common_strings"
        buildVars: [GPR_PATH, MUEN_COMMON_VARIANT]
        multiPackage: *common_provides_lib

      muinterrupts:
        privateEnvironment:
          GPR_PATH: "muinterrupts/muinterrupts"
        buildVars: [MUEN_COMMON_VARIANT, GPR_PATH]
        multiPackage: &common_lib
          "":
            buildScript: |
              muenBuild $1/${GPR_PATH}
            multiPackage:
              dev:
                packageScript: muenInstallPackageDev
              tgt:
                packageScript: muenInstallPackageTgt
          proof: *common_proof

      musinfo:
        privateEnvironment:
          GPR_PATH: "musinfo/musinfo"
        buildVars: [MUEN_COMMON_VARIANT, GPR_PATH]
        multiPackage: *common_lib

      muschedinfo:
        privateEnvironment:
          GPR_PATH: "muschedinfo/muschedinfo"
        buildVars: [MUEN_COMMON_VARIANT, GPR_PATH]
        multiPackage: *common_lib

      mutimedevents:
        privateEnvironment:
          GPR_PATH: "mutimedevents/mutimedevents"
        buildVars: [MUEN_COMMON_VARIANT, GPR_PATH]
        multiPackage: *common_lib
