inherit: [muen_component]

checkoutSCM:
  scm: git
  url: https://git.codelabs.ch/muen/component/base.git
  branch: main
  commit: 6b6dce399fc2bbf737ab07f0286e99e94c40efd8

multiPackage:
  ld:
    buildScript: |
      cp $1/component.ld .
    packageScript: |
      cp $1/component.ld .
  "":
    depends:
      - muen::common-common-dev
    buildVars: [ARCH, MUEN_BUILD_MODE]
    buildScript: |
      muenBuild $1/libmubase.gpr
    multiPackage:
      dev:
        provideDeps: ['*-dev']
        packageScript: muenInstallPackageDev
      tgt:
        provideDeps: ['*-tgt']
        packageScript: muenInstallPackageTgt
