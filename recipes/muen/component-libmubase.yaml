inherit: [muen_component]

metaEnvironment:
  PKG_LICENSE: "GPL-3.0-or-later WITH GNAT-exception"

checkoutSCM:
  scm: git
  url: https://git.codelabs.ch/muen/component/base.git
  branch: main
  commit: bc4883fca68fce42b3abb95b4150a5c142fe4350

multiPackage:
  ld:
    buildScript: |
      cp $1/component.ld .
    packageScript: |
      cp $1/component.ld .
  "":
    depends:
      - muen::common-common-dev
    buildVars: [ARCH, MUEN_BUILD_MODE]
    buildScript: |
      muenBuild $1/libmubase.gpr
    multiPackage:
      dev:
        provideDeps: ['*-dev']
        packageScript: |
          muenInstallPackageDev
          GPR=usr/share/gpr/libmubase.gpr
          sed -i -E '/for Languages use/ { s/, *"Asm"//; s/"Asm", *// }' $GPR
          if grep -q '"Asm"' $GPR; then
            echo "Failed to drop Asm language from $GPR" >&2
            exit 1
          fi
      tgt:
        provideDeps: ['*-tgt']
        packageScript: muenInstallPackageTgt
