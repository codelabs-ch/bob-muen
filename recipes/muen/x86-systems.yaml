checkoutSCM:
  scm: git
  url: https://git.codelabs.ch/muen/x86/systems.git
  branch: main
  commit: bfa5cced111928ad799cf595830a2ee4191337e7

multiPackage:
  bootloader-cfg:
    buildScript: |
      cp $1/bootloader/grub* .
      cp -r $1/bootloader/keys .
      cp $1/bootloader/menu.lst .
    packageScript: |
      cp -r $1/* .

  linux-config:
    inherit: [kconfig]
    buildVars: [LINUX_KASAN, LINUX_CONFIG]
    buildScript: |
      cp $1/linux/config/${LINUX_CONFIG} .
      kconfigDisable CONFIG_LOCALVERSION ${LINUX_CONFIG}

      if [[ ${LINUX_KASAN:-UNSET} != UNSET ]]; then
        kconfigEnable CONFIG_KASAN ${LINUX_CONFIG}
      fi
    packageScript: |
      cp $1/* .

  linux-config-unipi:
    inherit: [kconfig]
    buildVars: [LINUX_CONFIG]
    buildScript: |
      cp $1/linux/config/${LINUX_CONFIG} .
      kconfigDisable CONFIG_LOCALVERSION ${LINUX_CONFIG}

      echo 'CONFIG_NETFILTER_XT_MATCH_U32=m' >> ${LINUX_CONFIG}
      echo 'CONFIG_BRIDGE_NETFILTER=m' >> ${LINUX_CONFIG}
    packageScript: |
      cp $1/* .

  linux-component-spec:
    buildScript: |
      cp $1/linux/spec/linux.xml .
    packageScript: |
      cp $1/* .

  policy-files:
    buildScript: |
      ln -snf $1/policy .
    packageScript: |
      mkdir -p hardware
      cp $1/policy/hardware/cirrus7-nimbus.xml hardware/Cirrus7_Asus_Q87T.mlph.xml
      cp $1/policy/hardware/intel-nuc-5i5myhe.xml hardware/Intel_NUC_5i5MYHE.mlph.xml
      cp $1/policy/hardware/intel-nuc-6cayh.xml hardware/Intel_NUC_6CAYH.mlph.xml
      cp $1/policy/hardware/kontron-ktqm77.xml hardware/Client_III.mlph.xml
      cp $1/policy/hardware/lenovo-t430s.xml hardware/Lenovo_T430s.mlph.xml
      cp $1/policy/hardware/lenovo-t440s.xml hardware/Lenovo_T440s.mlph.xml
      cp $1/policy/hardware/lenovo-x260.xml hardware/Lenovo_X260.mlph.xml
      cp $1/policy/hardware/up-squared-e3950.xml hardware/UP_Squared_E3950.mlph.xml
      cp $1/policy/hardware/up-squared-e3950-coreboot.xml hardware/UP_Squared_E3950_Coreboot.mlph.xml
      cp $1/policy/hardware/qemu-kvm.xml hardware
      cp $1/policy/hardware/common_hardware.xml hardware

      mkdir platform
      cp $1/policy/platform/qemu-kvm.xml platform

      cp $1/policy/scheduling . -r

  policy-src:
    inherit: [muen_policy_src]
    buildScript: muenPolicySrcCreate $1
    packageScript: muenPolicySrcPackage $1

  policy-src-solo5:
    checkoutSCM:
      scm: url
      url: file://${UNIKERNEL_FILE:-Please specify UNIKERNEL_FILE!}
      dir: uni
    inherit: [muen_policy_src, solo5]
    buildVars: [UNIKERNEL_FILE]
    buildScript: |
      solo5ComposeConfig $1 $1/uni/$(basename $UNIKERNEL_FILE) \
          --channel-size 0x4000000
      muenPolicySrcCreate $1
    packageScript: |
      muenPolicySrcPackage $1
      fname=$(basename $UNIKERNEL_FILE)
      cp $1/$fname ./$fname

  policy-src-solo5-test:
    inherit: [muen_policy_src, solo5]
    depends:
      - devel::solo5-hello-muen
    buildScript: |
      solo5ComposeConfig $1 \
        ${BOB_DEP_PATHS[devel::solo5-hello-muen]}/test_hello.muen \
        --disable-reset \
        --bootparams "Hi!"
      muenPolicySrcCreate $1
    packageScript: |
      muenPolicySrcPackage $1
      cp $1/test_hello.muen .

  policy-demo:
    inherit: [python3, muen_policy]
    depends:
      - bsp::intel::microcode
      - muen::linux-image
      - muen::component-libs-muinitstub
      - muen::components-storage_drv-ahci
      - muen::components-storage_drv-nvme
      - muen::components-controller
      - muen::components-dbgserver
      - muen::components-dm
      - muen::components-example
      - muen::components-idle
      - muen::components-isolation_tests
      - muen::components-isolation_tests_monitor
      - muen::components-ps2_drv
      - muen::components-sl
      - muen::components-sm
      - muen::components-time
      - muen::components-vt

      - muen::x86-systems-linux-component-spec

      - name: demo::rootfs
        environment:
          ROOTFS_ARCH: "x86_64"

      - name: python::lxml
        tools:
          target-toolchain: host-compat-toolchain
      - name: utils::iucode-tool
        use: [tools]
        tools:
          target-toolchain: host-compat-toolchain
    buildTools:
      - acpica
      - iucode-tool
      - linux-gencspec
      - mucfgucode
      - mugensolo5
      - mugenzp
      - mugenmsrstore
      - mugenacpi
    buildVars: [SYSTEM, HARDWARE, PLATFORM]
    buildScript: |
      # build the linux cspecs
      linux-gencspec \
        ${BOB_DEP_PATHS[muen::linux-image]}/boot/vmlinux.bin \
        ${BOB_DEP_PATHS[muen::x86-systems-linux-component-spec]}/linux.xml \
        --out_spec linux.xml \
        --src_policy ${BOB_DEP_PATHS[$MUEN_POLICY_SRC]}/${SYSTEM}.xml
      # --initramfs ${BOB_DEP_PATHS[demo::rootfs]}/boot/initramfs.cpio.gz
      ADDITIONAL_CSPECS="$(pwd)/linux.xml"

      muenPolicyRun "${SYSTEM}" "${HARDWARE}" "${PLATFORM}" "${ADDITIONAL_CSPECS}"
    provideDeps: ['*']
